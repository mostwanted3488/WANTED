name: Build WANTED

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build -A x64

      - name: Configure (macOS, universal arm64 + x86_64)
        if: runner.os == 'macOS'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse "build/WANTED_artefacts/Release/VST3/WANTED.vst3" "dist/"
          Copy-Item "INSTALL.txt" "dist/"
          Compress-Archive -Path dist/* -DestinationPath WANTED-Windows-VST3.zip

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          cp -R "build/WANTED_artefacts/Release/VST3/WANTED.vst3" dist/
          cp -R "build/WANTED_artefacts/Release/AU/WANTED.component" dist/
          # signature ad-hoc (nécessaire pour charger sur Apple Silicon)
          codesign --force --deep --sign - dist/WANTED.vst3
          codesign --force --deep --sign - dist/WANTED.component
          cp INSTALL.txt dist/
          cd dist && ditto -c -k --sequesterRsrc --keepParent . ../WANTED-macOS-VST3-AU.zip

      - uses: actions/upload-artifact@v4
        with:
          name: WANTED-${{ matrix.name }}
          path: WANTED-*.zip

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          name: WANTED ${{ github.ref_name }}
          body: |
            **WANTED — Heat Distortion** · Underwater Palace

            - `WANTED-Windows-VST3.zip` → VST3 (Windows 64-bit)
            - `WANTED-macOS-VST3-AU.zip` → VST3 + AU (Mac Intel & Apple Silicon)

            Voir INSTALL.txt dans chaque zip.
